<!doctype html>
<meta charset="utf-8">
<title>Markdown viewer</title>
<style>body{font-family:system-ui;max-width:1400px;margin:16px auto;padding:0 16px}table{border-collapse:collapse;font-size:13px}td,th{border:1px solid #ccc;padding:4px;vertical-align:top}</style>
<div id="out">loading</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
fetch(new URLSearchParams(location.search).get('f')).then(r => r.text()).then(t => {
  document.getElementById('out').innerHTML = marked.parse(t);
  const rows = [...document.querySelectorAll('table')].map(tb => {
    const head = tb.querySelectorAll('thead th').length;
    return [...tb.querySelectorAll('tbody tr')].filter(tr => tr.children.length !== head).length;
  });
  window.REPORT = { tables: rows.length, badRows: rows.reduce((a, b) => a + b, 0), h2: document.querySelectorAll('h2').length, h3: document.querySelectorAll('h3').length, pipesInText: (document.getElementById('out').innerText.match(/\|\s*---/g) || []).length };
});
</script>
